# Streamlit theme for the Questless demo (app/streamlit_app.py).
[theme]
base = "dark"
primaryColor = "#e0a33c"            # quest gold: the single UI accent
backgroundColor = "#121211"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"
baseRadius = "8px"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
