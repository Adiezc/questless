[project]
name = "questless"
version = "0.1.0.dev0"
description = "Emergent quests from living worlds: a deterministic quest-economy engine for MMO-style worlds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Diez Cuadrado" }]
requires-python = ">=3.11"
# The engine is standard-library only. UI dependencies live in the "demo" extra (added in M10).
dependencies = []
keywords = ["game-ai", "procedural-generation", "agent-based-modeling", "game-economy", "quest-generation", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Scientific/Engineering :: Artificial Life",
]

# [project.urls] is added once the GitHub repository URL is known.

[project.scripts]
questless = "questless.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]  # planning docs hold pseudocode, not formattable Python

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
