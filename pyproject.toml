[project]
name = "questless"
version = "0.2.0"
description = "Emergent quests from living worlds: a deterministic quest-economy engine for MMO-style worlds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Diez Cuadrado" }]
requires-python = ">=3.11"
# The engine is standard-library only. UI dependencies live in the "demo" extra.
dependencies = []
keywords = ["game-ai", "procedural-generation", "agent-based-modeling", "game-economy", "quest-generation", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Scientific/Engineering :: Artificial Life",
]

[project.urls]
Homepage = "https://github.com/Adiezc/questless"
Repository = "https://github.com/Adiezc/questless"
Issues = "https://github.com/Adiezc/questless/issues"
Changelog = "https://github.com/Adiezc/questless/blob/main/CHANGELOG.md"

[project.scripts]
questless = "questless.cli:main"

[project.optional-dependencies]
demo = [
    "plotly>=7.1.0",
    "streamlit>=1.66.0",
]
experiments = [
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "*.md"]  # Markdown holds illustrative code, formatted by hand

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
