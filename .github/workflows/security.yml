name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  code-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Security lint (bandit)
        run: uvx bandit -r src app experiments -ll
      - name: Dependency audit (pip-audit)
        run: |
          uv export --format requirements-txt --all-extras --no-hashes --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
