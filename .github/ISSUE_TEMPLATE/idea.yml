name: Suggest an idea
description: An idea that would benefit Questless, big or small. No design needed.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should Questless do, teach or simulate?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: Who benefits (players, designers, researchers, teachers, contributors) and how?
  - type: textarea
    id: links
    attributes:
      label: Related milestones, games or research (optional)
