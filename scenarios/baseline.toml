# Questless baseline scenario: a stable settlement with no shocks.
# All values are initial guesses, to be tuned in milestone M9 (calibration).
# SPDX-License-Identifier: MIT

[scenario]
name = "Baseline"
description = "A stable mining and farming settlement. Few needs go unmet; few contracts appear."
seed = 42
days = 365
guilds = true                     # set false for the guilds on/off experiment

# Prices are integers in coin. Floor and ceiling are multiples of base_price.
# Base prices are set so every profession roughly breaks even at average skill (per day):
#   miner  1.4 ore x 8 x 0.8 (after haulage)   = 9.0  vs food 4 + tool wear 2.4
#   farmer 2.3 food x 4 x 0.8                  = 7.4  vs tool wear 2.4
#   smith  (tools 24-16, weapons 40-24 margin) ~ 13.6 vs food 4 + tool wear 2.4
#   guard  wage 7                                     vs food 4 + weapon wear 2
[goods.food]
base_price = 4
price_floor = 0.25
price_ceiling = 4.0

[goods.iron_ore]
base_price = 8
price_floor = 0.25
price_ceiling = 4.0

[goods.tools]
base_price = 24
price_floor = 0.25
price_ceiling = 4.0

[goods.weapons]
base_price = 40
price_floor = 0.25
price_ceiling = 4.0

# Population: 34 + 16 + 8 + 14 + 28 = 100 NPCs. Rough daily balance at average skill:
#   food:  34 farmers x 3.3 = 112 produced vs 100 eaten
#   tools: wear uses ~6.5/day (13 ore); weapons ~1.4/day (4.2 ore); miners 16 x 1.4 = 22 ore
#   smiths: 8 x 2 = 16 crafts/day of capacity for ~11 needed
#   transport: 14 merchants x 14 = 196 units/day for ~135 units of farm + mine output
# wallet and tool_condition are [low, high] ranges drawn per NPC from the seed.
# Gatherers have `output`; crafters have `crafts_per_day` + `recipes` (inputs per unit).
[professions.farmer]
count = 34
site = "farms"
wallet = [60, 100]
tool_condition = [0.3, 1.0]
inventory = { food = 5, tools = 1 }
equipment = "tools"
wear = 0.1                    # condition lost per day; a tool lasts ~8 days
no_tool_factor = 0.5
output = { food = 3.3 }       # base units per day, x skill x modifiers

[professions.miner]
count = 16
site = "mine"
wallet = [60, 100]
tool_condition = [0.3, 1.0]
inventory = { food = 5, tools = 1 }
equipment = "tools"
wear = 0.1
no_tool_factor = 0.3
output = { iron_ore = 1.4 }

[professions.blacksmith]
count = 8
site = "market"
wallet = [120, 180]
tool_condition = [0.3, 1.0]
inventory = { food = 5, iron_ore = 12, tools = 2 }
equipment = "tools"
wear = 0.1
no_tool_factor = 0.5
crafts_per_day = 2
recipes = { tools = { iron_ore = 2 }, weapons = { iron_ore = 3 } }

[professions.merchant]
count = 14
site = "market"
wallet = [150, 250]
tool_condition = [0.3, 1.0]
inventory = { food = 5 }

[professions.guard]
count = 28
site = "market"
wallet = [40, 80]
tool_condition = [0.3, 1.0]   # weapon condition for guards
inventory = { food = 5, weapons = 1 }
equipment = "weapons"
wear = 0.05

[needs]
food_per_day = 1
equipment_threshold = 0.2   # replace tools/weapons below this condition
hungry_after = 2            # days without food before productivity drops
hungry_productivity = 0.5
max_unsold_days = 6         # producers pause once unsold stock exceeds this many days of recent sales

[market]
price_adjustment = 0.05     # max relative price change per day
target_cover_days = 3.0     # stock on offer that the market treats as "normal", in days of demand
stock_weight = 0.5          # weight of the stock term relative to the production/consumption term
effort = [0.6, 1.3]         # gatherer effort range: effort = price / base price, clamped
export_share = 0.2          # traders from outside spend this share of their coin on surplus daily

[transport]
capacity_per_merchant = 14  # units/day each merchant hauls from mine and farms to the market
fee_rate = 0.2              # share of the goods' market value paid by the producer to carriers

# Contract engine. An NPC escalates a need once it has gone unmet for `patience` days *and* the
# market had nothing to sell it (scarcity, not poverty). Every contract is escrowed when posted.
[contracts]
max_open = 12                 # cap on open + accepted contracts
max_new_per_tick = 3
deadline_days = 10
cooldown_days = 5             # quiet period for a need whose contract expired or was cancelled
resolve_days = 3              # an untaken contract is withdrawn once its need is gone this long
npc_premium = 1.2             # NPC-funded reward = market value x premium x urgency
urgency_step = 0.1            # +10% per day the need persists beyond patience
max_urgency = 2.0
town_max_share = 0.2          # most of the town treasury one contract may escrow
caravan_days = 3              # an import from outside takes this long; deadlines allow for it
transport_backlog_days = 3.0  # site backlog (days of output) that signals a transport bottleneck
min_reward = 60               # smaller jobs are not posted; pooled guild contracts cover them
town_emergency_threshold = 0.4  # share of guards short of a good before the town pools their needs

[traits]
skill = [0.8, 1.2]       # production multiplier
thrift = [0.1, 0.5]      # share of wallet kept as cash reserve
stock_days = [2, 5]      # days of food and inputs an NPC tries to hold
patience = [2, 5]        # days a need stays unmet before it is escalated

# Guilds collect dues (a share of each member's daily income), keep a treasury, and use it for
# (a) relief: topping broke members up to `relief_days` of food money, and (b) funding contracts
# when many members share a need (milestone M5). Policy fields:
#   emergency_threshold     share of members with the same need that triggers a guild contract
#   max_contract_share      most of the treasury one contract may escrow
#   reward_premium          contract reward multiplier over market value
#   relief_days             food money a broke member is topped up to, in days (0 = no relief)
#   max_daily_relief_share  most of the treasury spent on relief per day
#   reserve                 coin relief never touches; kept for emergencies and contracts
#   max_treasury            coin above this pays the town's upkeep_rate each day (optional;
#                           leave it out to exempt the guild)
[guilds.miners]
name = "Miners Guild"
professions = ["miner"]
treasury = 600
dues_rate = 0.05

[guilds.miners.policy]
emergency_threshold = 0.6
max_contract_share = 0.4
reward_premium = 1.3
relief_days = 2
max_daily_relief_share = 0.05
reserve = 500
max_treasury = 3000

[guilds.merchants]
name = "Merchants Guild"
professions = ["merchant", "farmer"]
treasury = 800
dues_rate = 0.05

[guilds.merchants.policy]
emergency_threshold = 0.6
max_contract_share = 0.4
reward_premium = 1.3
relief_days = 2
max_daily_relief_share = 0.05
reserve = 500
max_treasury = 3000

[guilds.blacksmiths]
name = "Blacksmiths Guild"
professions = ["blacksmith"]
treasury = 1000
dues_rate = 0.05

[guilds.blacksmiths.policy]
emergency_threshold = 0.6
max_contract_share = 0.4
reward_premium = 1.3
relief_days = 2
max_daily_relief_share = 0.05
reserve = 500
max_treasury = 3000

[town]
treasury = 5000
guard_wage = 7           # coin per guard per day, paid by the town
market_tax = 0.05        # share of each trade's value paid to the town
upkeep_rate = 0.03       # daily levy on each NPC's coin above upkeep_exempt
upkeep_exempt = 60
# Optional higher brackets (M58.3): coin above each threshold pays that rate instead. Thresholds
# rise from upkeep_exempt; no exemptions and no cap by design. For example:
# [[town.levy_brackets]]
# threshold = 500
# rate = 0.05
# Reserve target (#72): while the town holds less than reserve_days of guard wages (10 × 28 × 7 =
# 1,960 coin), every levy rate rises by reserve_rate until it recovers. reserve_days = 0 turns it off.
reserve_days = 10
reserve_rate = 0.02

# Legitimacy (M48): the town's authority, 0-1. Unpaid wages and hunger lower it; while it is low,
# NPCs evade the upkeep levy. Off in the baseline so v0.1 results stay comparable.
[legitimacy]
enabled = false
start = 1.0
fall_rate = 0.2          # share of the gap to the target closed per day when falling
recover_rate = 0.02      # ... and when recovering: legitimacy falls fast and returns slowly
hunger_window = 7        # days of hunger averaged into the pressure
min_compliance = 0.5     # chance an NPC pays the levy at legitimacy 0

[player]
wallet = 600
caravan_markup = 1.25    # caravan imports cost base price x this and take contracts.caravan_days

# Goods available to import from beyond the map (player caravans). Coin paid for imports
# moves to the "outside" account, so total coin stays constant.
[outside]
food = 100000
iron_ore = 100000
tools = 2000      # traders from the next town; caravans can bring crafted goods too
weapons = 1000

# Scheduled shocks. The baseline has none; see iron_shortage.toml and drought.toml.
# [[shocks]]
# name = "Mine collapse"
# effect = "site_output"     # or "transport_capacity"
# site = "mine"
# start = 10                 # tick the shock begins
# duration = 20
# factor = 0.3

# Civilization DNA (M54): knobs a colony may change from its parent, each within [low, high].
# Only institutional knobs are allowed (see MUTABLE_KNOBS in config.py); "*" means every guild.
# [founding.bounds]
# "town.upkeep_rate" = [0.02, 0.05]
# "guilds.*.dues_rate" = [0.03, 0.08]
