# Scenario A: iron shortage. A collapse at the mine cuts ore output to 20% for 30 days.
# Expect: smiths run out of ore, the Blacksmiths Guild pools funds for an iron contract, tools
# get scarce, and the economy recovers on its own within weeks of the mine reopening.
# For a deeper cascade (into food) and a slump the economy cannot escape alone, see
# mine_disaster.toml.
# SPDX-License-Identifier: MIT

[scenario]
extends = "baseline.toml"
name = "Iron Shortage"
description = "A collapse at the mine cuts iron ore output to 20% for 30 days from day 15."
days = 120

[[shocks]]
name = "Mine collapse"
effect = "site_output"
site = "mine"
start = 15
duration = 30
factor = 0.2
